<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="130" font-size="64" font-weight="800" fill="white">LnaLang4U</text>

  <!-- Subtitle -->
  <text x="80" y="190" font-size="28" fill="#94a3b8">1M-context DeepSeek-V4-Flash inference</text>
  <text x="80" y="230" font-size="28" fill="#94a3b8">with SSD KV cache offload</text>

  <!-- Tagline -->
  <text x="80" y="300" font-size="20" fill="#60a5fa" font-weight="600">Turn your local Blackwell machine into a 1M-context coding-agent backend.</text>

  <!-- Performance numbers -->
  <rect x="80" y="340" width="360" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="260" y="380" text-anchor="middle" font-size="36" font-weight="700" fill="#34d399">63 tok/s</text>
  <text x="260" y="405" text-anchor="middle" font-size="14" fill="#94a3b8">Single-request throughput</text>

  <rect x="460" y="340" width="200" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="560" y="380" text-anchor="middle" font-size="36" font-weight="700" fill="#60a5fa">400</text>
  <text x="560" y="405" text-anchor="middle" font-size="14" fill="#94a3b8">tok/s @ 8 concurrent</text>

  <rect x="680" y="340" width="200" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="780" y="380" text-anchor="middle" font-size="36" font-weight="700" fill="#f472b6">1M</text>
  <text x="780" y="405" text-anchor="middle" font-size="14" fill="#94a3b8">Context length</text>

  <!-- Hardware -->
  <text x="80" y="490" font-size="15" fill="#64748b">4× RTX PRO 6000 Blackwell · NVIDIA Blackwell SM120 · TP=4</text>
  <text x="80" y="515" font-size="15" fill="#64748b">GPU L1 → DRAM L2 → Optane SSD L3 · OpenAI / Anthropic API</text>

  <!-- Bottom bar -->
  <rect x="80" y="555" width="1120" height="2" fill="#334155"/>
  <text x="80" y="590" font-size="14" fill="#475569">github.com/lna-lab/LnaLang4U</text>
</svg>
