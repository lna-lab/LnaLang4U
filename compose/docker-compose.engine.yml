services:
  lnalang4u:
    image: sglang-dsv4-diskkv:latest
    container_name: lnalang4u-engine
    ports:
      - "9000:9000"
    volumes:
      - ${MODEL_DIR}:/workspace/model:ro
      - ${DSV4_KERNEL_DIR}:/dsv4:ro
      - ${DISKKV_DIR}:/diskkv
    environment:
      CUDA_VISIBLE_DEVICES: "${GPUS:-0,2,3,4}"
      PYTHONPATH: /dsv4
      SGLANG_DISK_OFFLOAD_DIR: /diskkv
      SGLANG_DISK_OFFLOAD_MAX_SPACE_MB: "${DISKKV_MB:-1048576}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    command: >
      python3 -m sglang.launch_server
      --model-path /workspace/model --host 0.0.0.0 --port 9000
      --served-model-name deepseek-v4-flash --trust-remote-code
      --tensor-parallel-size 4 --context-length ${CONTEXT_LENGTH:-32768}
      --mem-fraction-static ${MEM_FRACTION:-0.80} --kv-cache-dtype fp8_e4m3
      --fp8-gemm-backend triton --page-size 256
      --enable-hierarchical-cache --hicache-ratio ${HICACHE_RATIO:-1.5}
      --hicache-io-backend direct --hicache-mem-layout page_first
      --hicache-storage-backend disk_offload
      --max-running-requests ${MAX_RUNNING:-4}
